
[env]
TERM = "xterm-256color"

[font]
size = 16

[font.bold]
family = "Iosevka Nerd Font"
style = "Bold"

[font.bold_italic]
family = "Iosevka Nerd Font"
style = "Bold Italic"

[font.italic]
family = "Iosevka Nerd Font"
style = "Italic"

[font.normal]
family = "Iosevka Nerd Font"
style = "Regular"

[window]
opacity = 0.5

[general]
import = [
  "~/.config/alacritty/catppuccin-mocha.toml"
]
